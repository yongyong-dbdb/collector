apiVersion: v1
kind: ConfigMap
metadata:
  name: toss-chart-collector-config
  namespace: postgres
data:
  DB_HOST: pg-cluster-rw
  DB_PORT: "5432"
  DB_NAME: appdb
  ENABLE_TOSS: "true"
  ENABLE_YAHOO: "true"
  ENABLE_TOSS_NEWS: "true"
  RUN_ONCE: "false"
  SLEEP_SECONDS: "300"
  REQUEST_TIMEOUT: "20"
  REQUEST_RETRIES: "3"
  RETRY_BACKOFF_SECONDS: "2"
  TOSS_OPENAPI_BASE_URL: https://openapi.tossinvest.com
  TOSS_TOKEN_EXPIRY_SKEW_SECONDS: "60"
  TOSS_CANDLE_MIN_INTERVAL_SECONDS: "0.22"
  ENABLE_TOSS_REFERENCE_SYNC: "true"
  TOSS_REFERENCE_SYNC_SECONDS: "86400"
  TOSS_WTS_WEB_BASE_URL: https://www.tossinvest.com
  TOSS_WTS_INFO_BASE_URL: https://wts-info-api.tossinvest.com
  TOSS_NEWS_SCOPE: ALL_HIGHLIGHT
  TOSS_NEWS_LIMIT: "50"
  TOSS_NEWS_DETAIL_ENABLED: "true"
  TOSS_NEWS_DETAIL_MAX_PER_CYCLE: "20"
  YAHOO_RANGE: 1d
  YAHOO_INTERVAL: 1m
  YAHOO_RECENT_CANDLES: "15"
  YAHOO_INCLUDE_PREPOST: "true"
