apiVersion: apps/v1
kind: Deployment
metadata:
  name: toss-chart-collector
  namespace: postgres
  labels:
    app.kubernetes.io/name: toss-chart-collector
    app.kubernetes.io/component: collector
    app.kubernetes.io/version: v1.7.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: toss-chart-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toss-chart-collector
        app.kubernetes.io/component: collector
        app.kubernetes.io/version: v1.7.0
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: collector
          image: yongyongvvv/toss-chart-collector:v1.7.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: toss-chart-collector-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: pg-cluster-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-cluster-app
                  key: password
            - name: TOSS_OPENAPI_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: toss-openapi-secret
                  key: client-id
            - name: TOSS_OPENAPI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: toss-openapi-secret
                  key: client-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import os, psycopg2; c=psycopg2.connect(host=os.environ['DB_HOST'],port=os.environ['DB_PORT'],dbname=os.environ['DB_NAME'],user=os.environ['DB_USER'],password=os.environ['DB_PASSWORD'],connect_timeout=5); c.close()"
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import os, psycopg2; c=psycopg2.connect(host=os.environ['DB_HOST'],port=os.environ['DB_PORT'],dbname=os.environ['DB_NAME'],user=os.environ['DB_USER'],password=os.environ['DB_PASSWORD'],connect_timeout=5); c.close()"
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
